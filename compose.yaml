name: marona-a2a

services:
  python:
    build:
      context: .
      dockerfile: examples/python/Dockerfile
    environment:
      A2A_BASE_URL: http://127.0.0.1:8100
    ports: ["8100:8100"]

  typescript:
    profiles: ["typescript"]
    build:
      context: .
      dockerfile: examples/typescript/Dockerfile
    environment:
      A2A_BASE_URL: http://127.0.0.1:8101
    ports: ["8101:8100"]

  java:
    profiles: ["java"]
    build:
      context: .
      dockerfile: examples/java/Dockerfile
    environment:
      A2A_BASE_URL: http://127.0.0.1:8102
    ports: ["8102:8100"]

